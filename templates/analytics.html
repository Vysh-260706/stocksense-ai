<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>StockSense Analytics</title>

    <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Google Font -->

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <!-- Chart.js -->

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>

        body{

            background:
            linear-gradient(
            135deg,
            #0f172a,
            #1e293b
            );

            font-family:'Poppins',sans-serif;

            color:white;

            min-height:100vh;
        }

        .main-container{

            padding:40px;
        }

        .title-box{

            margin-bottom:40px;
        }

        .title-box h1{

            font-size:42px;

            font-weight:700;
        }

        .title-box p{

            color:#cbd5e1;
        }

        .chart-card{

            background:rgba(255,255,255,0.08);

            backdrop-filter:blur(15px);

            border-radius:25px;

            padding:25px;

            margin-bottom:30px;

            box-shadow:
            0 8px 32px rgba(0,0,0,0.3);

            transition:0.3s;
        }

        .chart-card:hover{

            transform:translateY(-5px);
        }

        canvas{

            width:100% !important;

            height:350px !important;
        }

    </style>

</head>

<body>

<div class="container-fluid main-container">

    <!-- TITLE -->

    <div class="title-box">

        <h1>📊 AI Analytics Dashboard</h1>

        <p>
            Real-time inventory and sales insights
        </p>

    </div>

    <div class="row">

        <!-- SALES CHART -->

        <div class="col-lg-6">

            <div class="chart-card">

                <h4>📈 Monthly Sales</h4>

                <canvas id="salesChart"></canvas>

            </div>

        </div>

        <!-- STOCK CHART -->

        <div class="col-lg-6">

            <div class="chart-card">

                <h4>📦 Product Stock Levels</h4>

                <canvas id="stockChart"></canvas>

            </div>

        </div>

    </div>

    <div class="row">

        <!-- CATEGORY CHART -->

        <div class="col-lg-6">

            <div class="chart-card">

                <h4>🛒 Category Distribution</h4>

                <canvas id="categoryChart"></canvas>

            </div>

        </div>

        <!-- FORECAST CHART -->

        <div class="col-lg-6">

            <div class="chart-card">

                <h4>🤖 AI Demand Forecast</h4>

                <canvas id="forecastChart"></canvas>

            </div>

        </div>

    </div>

</div>

<script>

//////////////////////////////////////////////////
// SALES CHART
//////////////////////////////////////////////////

new Chart(

    document.getElementById('salesChart'),

    {

        type:'line',

        data:{

            labels:[
                'Jan',
                'Feb',
                'Mar',
                'Apr',
                'May',
                'Jun'
            ],

            datasets:[{

                label:'Sales',

                data:[
                    120,
                    190,
                    300,
                    250,
                    420,
                    500
                ],

                borderColor:'#3b82f6',

                backgroundColor:
                'rgba(59,130,246,0.3)',

                fill:true,

                tension:0.4
            }]
        },

        options:{

            responsive:true,

            plugins:{
                legend:{
                    labels:{
                        color:'white'
                    }
                }
            },

            scales:{
                x:{
                    ticks:{
                        color:'white'
                    }
                },

                y:{
                    ticks:{
                        color:'white'
                    }
                }
            }
        }

    }

);

//////////////////////////////////////////////////
// STOCK CHART
//////////////////////////////////////////////////

new Chart(

    document.getElementById('stockChart'),

    {

        type:'bar',

        data:{

            labels:[
                'Rice',
                'Milk',
                'Watch',
                'Chair',
                'Shirt'
            ],

            datasets:[{

                label:'Stock',

                data:[
                    120,
                    40,
                    18,
                    70,
                    95
                ],

                backgroundColor:[

                    '#2563eb',
                    '#16a34a',
                    '#dc2626',
                    '#f59e0b',
                    '#8b5cf6'

                ],

                borderRadius:10
            }]
        },

        options:{

            responsive:true,

            plugins:{
                legend:{
                    labels:{
                        color:'white'
                    }
                }
            },

            scales:{
                x:{
                    ticks:{
                        color:'white'
                    }
                },

                y:{
                    ticks:{
                        color:'white'
                    }
                }
            }
        }

    }

);

//////////////////////////////////////////////////
// CATEGORY PIE CHART
//////////////////////////////////////////////////

new Chart(

    document.getElementById('categoryChart'),

    {

        type:'doughnut',

        data:{

            labels:[
                'Electronics',
                'Groceries',
                'Furniture',
                'Fashion'
            ],

            datasets:[{

                data:[
                    35,
                    25,
                    20,
                    20
                ],

                backgroundColor:[

                    '#3b82f6',
                    '#16a34a',
                    '#f59e0b',
                    '#8b5cf6'

                ]
            }]
        },

        options:{

            responsive:true,

            plugins:{
                legend:{
                    labels:{
                        color:'white'
                    }
                }
            }
        }

    }

);

//////////////////////////////////////////////////
// FORECAST CHART
//////////////////////////////////////////////////

new Chart(

    document.getElementById('forecastChart'),

    {

        type:'radar',

        data:{

            labels:[

                'Rice',
                'Milk',
                'Watch',
                'Chair',
                'Shoes'

            ],

            datasets:[{

                label:'Demand Forecast',

                data:[
                    90,
                    50,
                    95,
                    70,
                    85
                ],

                backgroundColor:
                'rgba(59,130,246,0.3)',

                borderColor:'#3b82f6'
            }]
        },

        options:{

            responsive:true,

            plugins:{
                legend:{
                    labels:{
                        color:'white'
                    }
                }
            },

            scales:{
                r:{
                    pointLabels:{
                        color:'white'
                    },

                    ticks:{
                        color:'white'
                    }
                }
            }
        }

    }

);

</script>

</body>

</html>
