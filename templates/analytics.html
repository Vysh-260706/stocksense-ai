<!DOCTYPE html>
<html>

<head>
    <title>Analytics | StockSense AI</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <style>

        body{
            background:#f4f7fc;
            font-family:'Poppins',sans-serif;
        }

        .container-box{
            padding:40px;
        }

        .chart-card{
            background:white;
            padding:25px;
            border-radius:20px;
            box-shadow:0 5px 20px rgba(0,0,0,0.08);
            margin-bottom:30px;
        }

        h1{
            font-weight:700;
            margin-bottom:30px;
        }

    </style>

</head>

<body>

    <div class="container container-box">

        <h1>StockSense AI Analytics Dashboard</h1>

        <div class="row">

            <div class="col-md-6">

                <div class="chart-card">

                    <h4>Total Product Sales</h4>

                    <canvas id="salesChart"></canvas>

                </div>

            </div>

            <div class="col-md-6">

                <div class="chart-card">

                    <h4>Stock Availability</h4>

                    <canvas id="stockChart"></canvas>

                </div>

            </div>

        </div>

        <div class="row">

            <div class="col-md-12">

                <div class="chart-card">

                    <h4>Monthly Revenue Analysis</h4>

                    <canvas id="revenueChart"></canvas>

                </div>

            </div>

        </div>

    </div>

<script>

    // SALES CHART

    new Chart(document.getElementById('salesChart'), {

        type: 'bar',

        data: {

            labels: ['Rice','Milk','Oil','Soap','Sugar'],

            datasets: [{

                label: 'Sales',

                data: [120,190,300,150,210],

                backgroundColor: [
                    '#2563eb',
                    '#0ea5e9',
                    '#06b6d4',
                    '#3b82f6',
                    '#60a5fa'
                ]

            }]
        }

    });


    // STOCK CHART

    new Chart(document.getElementById('stockChart'), {

        type: 'pie',

        data: {

            labels: ['Available','Low Stock','Out Of Stock'],

            datasets: [{

                data: [65,25,10],

                backgroundColor: [
                    '#22c55e',
                    '#f59e0b',
                    '#ef4444'
                ]

            }]
        }

    });


    // REVENUE CHART

    new Chart(document.getElementById('revenueChart'), {

        type: 'line',

        data: {

            labels: ['Jan','Feb','Mar','Apr','May','Jun'],

            datasets: [{

                label: 'Revenue',

                data: [1200,1900,3000,2500,4200,5000],

                borderColor: '#2563eb',

                backgroundColor: '#93c5fd',

                fill:true,

                tension:0.4

            }]
        }

    });

</script>

</body>
</html>
